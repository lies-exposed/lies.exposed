name: Release Please

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "compose*.yml"
      - ".github/workflows/deploy.yml"
      - "Dockerfile*"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # The release PR must be opened as a real user, not with GITHUB_TOKEN.
      #
      # With GITHUB_TOKEN the PR and its commits belong to github-actions[bot]:
      #   author    github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
      #   committer GitHub <noreply@github.com>, unverified
      # Every pull_request CI run that such a PR triggers then waits for a human
      # ("Review pending changes") and completes as action_required with zero
      # jobs; approving it only fixes that one push, because release-please
      # force-pushes its branch on every commit merged to main and re-queues a
      # fresh held run. So the required checks named by the no-push-force ruleset
      # (CI admin/api/packages/web/worker/agent) are never reported, GitHub counts
      # a missing required check as unsatisfied, and the PR stays BLOCKED until
      # merged by hand - which also stalls every image push in this workflow,
      # because those jobs gate on releases_created.
      #
      # Dependabot PRs show the other half of the rule: their commits are attributed
      # to a real account (ascariandrea <dev.ascariandrea@gmail.com>), so CI runs
      # immediately and reports all six required checks - which is why those PRs
      # merge normally while release-please PRs stay BLOCKED.
      #
      # A PAT acts as its owner: the PR is authored by that user, commits carry
      # their verified name/email, CI runs on every push (all required checks go
      # green) and the merge gate opens. The fallback keeps releases working if the
      # secret is missing; it only restores the held-CI state described above.
      # The detection cannot use a step-level `if: secrets... == ''`: per the
      # contexts reference, `jobs.<job_id>.steps.if` exposes github/needs/strategy/
      # matrix/job/runner/env/vars/steps/inputs but NOT secrets. `steps.env` does
      # expose secrets, so test the value from the shell instead.
      - name: Warn when the release-please PAT is missing
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN:-}" ]; then
            msg='secrets.RELEASE_PLEASE_TOKEN is not set: this run opens release PRs as github-actions[bot], whose CI runs wait for manual approval, so the release PR must be merged by hand.'
            echo "::warning::$msg"
            printf '%s\n' '### Missing RELEASE_PLEASE_TOKEN secret' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Warm the pnpm store + packages build caches on main so PRs can restore them.
  # Runs on every push to main (cheap); everything below runs only on release.
  warm-cache:
    needs: [release-please]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-deps

      - uses: ./.github/actions/build-packages

  # Setup: build ai-bot (only when release is created)
  setup:
    needs: [release-please]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-deps

      - uses: ./.github/actions/build-packages

      - name: Build ai-bot
        run: pnpm ai-bot build

      - name: Upload ai-bot build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-bot-build
          path: services/ai-bot/build/
          retention-days: 1

  # Build and sync Storybook to MinIO (only when release is created)
  storybook:
    needs: [release-please]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-deps

      - uses: ./.github/actions/build-packages

      - name: Build Storybook
        run: |
          set -euo pipefail
          # Use production env for Storybook build (CI)
          cp -f services/storybook/.env.prod services/storybook/.env
          export VITE_NODE_ENV=production

          pnpm storybook build:app

      - name: Install MinIO Client
        uses: hostwithquantum/setup-mc@v1.2.0
        with:
          alias-name: lies-exposed-space
          alias-url: https://space.lies.exposed
          alias-access-key: ${{ secrets.MINIO_ACCESS_KEY }}
          alias-secret-key: ${{ secrets.MINIO_SECRET_KEY }}

      - name: Sync Storybook to MinIO
        run: |
          mc mirror --overwrite --remove \
            services/storybook/build \
            lies-exposed-space/storybook

  # Build and push Docker images in parallel (only when release is created)
  deploy:
    needs: [release-please, setup]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: admin
            enabled: true
            dockerfile: admin.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-admin:latest
          - service: agent
            enabled: true
            dockerfile: agent.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-agent:latest
          - service: ai-bot
            enabled: true
            dockerfile: ai-bot.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-ai-bot:latest
            needs_artifacts: true
          - service: api
            enabled: true
            dockerfile: api.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-api:latest
          - service: web
            enabled: true
            dockerfile: web.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-web:latest
          - service: worker
            enabled: true
            dockerfile: worker.Dockerfile
            image_tag: ghcr.io/lies-exposed/liexp-worker:latest

    name: Deploy ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7
        if: ${{ matrix.enabled }}

      - name: Get version from package.json
        if: ${{ matrix.enabled }}
        id: pkg-version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      # Download ai-bot build artifacts if needed
      - name: Download ai-bot build artifacts
        if: ${{ matrix.needs_artifacts && matrix.enabled }}
        uses: actions/download-artifact@v8
        with:
          name: ai-bot-build
          path: services/ai-bot/build/

      # Docker build and push
      - name: Docker build ${{ matrix.service }}
        if: ${{ matrix.enabled && matrix.dockerfile }}
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile: ${{ matrix.dockerfile }}
          image_name: ${{ matrix.image_tag }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ needs.release-please.outputs.releases_created == 'true' }}
          cache_scope: ${{ matrix.service }}
          build-args: |
            DOTENV_CONFIG_PATH=${{ matrix.service == 'admin' && '.env.prod' || matrix.service == 'web' && '.env.prod' || '.env' }}
            VITE_VERSION=${{ steps.pkg-version.outputs.version }}
            VITE_COMMIT_HASH=${{ github.sha }}
            VERSION=${{ steps.pkg-version.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
