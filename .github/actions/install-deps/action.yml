name: Install Deps

description: Install deps with pnpm (store cached by pnpm/action-setup)

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26

    # `cache: true` restores/saves the pnpm store keyed on pnpm-lock.yaml,
    # with a prefix restore-key fallback (replaces manual actions/cache steps).
    - uses: pnpm/action-setup@v6.1.1
      name: Install pnpm
      with:
        run_install: false
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
